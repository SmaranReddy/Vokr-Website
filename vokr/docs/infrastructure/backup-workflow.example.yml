# PROPOSED — not active. Copy to .github/workflows/backup.yml in a reviewed
# PR once the owner has done steps 1–4 of docs/infrastructure/backups.md.
name: Database backup

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 h, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: backups
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vokr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vokr/package-lock.json
      - name: Install pg_dump 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-17 age
      - run: npm ci --no-audit --no-fund
      - name: Backup, upload, prune
        env:
          PGHOST: ${{ secrets.BACKUP_PGHOST }}
          PGPORT: "5432"
          PGUSER: ${{ secrets.BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          PGDATABASE: postgres
          PGSSLMODE: require
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: vokr-backups
        run: npx tsx scripts/backup/backup.ts --out "$RUNNER_TEMP/backups" --upload --prune --apply
      - name: Remove the plaintext dump from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/backups"
