services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vokr
      POSTGRES_PASSWORD: vokr_local_dev
      POSTGRES_DB: vokr
    ports:
      # Host port 55432, not 5432: several dev machines already run a
      # native Postgres service on 5432, which silently wins the port and
      # produces a confusing "authentication failed" against the wrong
      # server. 55432 avoids the collision unconditionally.
      - "55432:5432"
    volumes:
      - vokr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vokr -d vokr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vokr_postgres_data:
