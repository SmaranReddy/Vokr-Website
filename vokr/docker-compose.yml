services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vokr
      POSTGRES_PASSWORD: vokr_local_dev
      POSTGRES_DB: vokr
    ports:
      - "5432:5432"
    volumes:
      - vokr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vokr -d vokr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vokr_postgres_data:
